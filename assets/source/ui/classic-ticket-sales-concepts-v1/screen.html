<!doctype html><html lang="en"><meta charset="utf-8"><title>Classic booking — design concept</title><style>
@font-face{font-family:Source;src:url(references/SourceSans3-Variable.ttf)}@font-face{font-family:Zilla;src:url(references/ZillaSlab-SemiBold.ttf)}*{box-sizing:border-box}body{margin:0;background:#0e1f1a;font:18px Source;color:#1f2a26}main{width:1280px;height:720px;position:absolute;transform-origin:0 0;background:#17302a}header{height:68px;padding:13px 28px;color:#f5ebd6;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #426052}.sub{font-size:16px;color:#56615a}.muted{color:#b9c4b8}.steps{display:flex;gap:24px;align-items:center;font-size:18px}.active{color:#f5ebd6;border-bottom:3px solid #d8a43b;padding:10px 0}.sheet{position:absolute;left:24px;top:88px;width:1232px;height:550px;border-radius:8px;background:#f5ebd6;padding:22px 24px}h1{font:32px Zilla;margin:0 0 5px}h2{font:24px Zilla;margin:0 0 6px}h3{font:21px Zilla;margin:0}p{margin:8px 0}button{font:600 17px Source;padding:9px 16px;border:1px solid #b5b6a0;border-radius:5px;background:#fff8e9;color:#1f2a26}button.gold{background:#d8a43b;border-color:#d8a43b}button.teal{background:#2b6e66;color:#fff8e9}button:focus-visible{outline:3px solid #d8a43b;outline-offset:3px}.cols{display:grid;grid-template-columns:258px 550px 1fr;gap:22px;margin-top:18px}.rule{border-left:1px solid #d5c39e;padding-left:20px}.slot{background:#dceae5;border:1px solid #bfd7cf;border-radius:5px;padding:12px;margin-top:10px;height:87px}.slot.folk{background:#e4e9d6}.slot.pop{background:#f1d9df}.slot strong{font:21px Zilla;display:block}.small{font-size:16px}.slot .meta{display:flex;justify-content:space-between;font-size:16px;color:#56615a}.table{width:100%;border-collapse:collapse;margin-top:12px;font-size:16px;table-layout:fixed}.table th{font-size:16px;text-align:left;border-bottom:2px solid #d5c39e;font-weight:600}.table td{height:40px;border-bottom:1px solid #e2d3b3;padding-right:5px}.table th:first-child{width:145px}.table th:nth-child(2){width:80px}.table th:nth-child(3){width:48px}.table .chosen{background:#dceae5}.table .name{line-height:1.1}.rating{font-size:16px;color:#2b6e66}.metric{font:34px Zilla;margin:2px 0}.moneyline{display:flex;justify-content:space-between;margin-top:3px;font-size:17px}.price{display:flex;gap:10px;align-items:center;margin:4px 0 8px}.price .value{background:#fff8e9;border:1px solid #d5c39e;padding:7px 24px;font:24px Zilla}.note{background:#fbf4e4;border-left:3px solid #d8a43b;padding:8px 11px;font-size:16px;margin-top:8px}.warn{background:#f8dcc3;border-left-color:#b8551e}.budget{border-top:1px solid #d5c39e;margin-top:10px;padding-top:8px}.foot{position:absolute;left:24px;right:24px;top:649px;display:flex;justify-content:space-between;align-items:center;color:#f5ebd6}.caption{font-size:16px;color:#b9c4b8}.eyebrow{font-size:16px;letter-spacing:1px}.result{left:180px;width:920px;height:514px;top:102px;padding:30px 38px}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:26px}.total{background:#dceae5;padding:16px;border-radius:5px;margin-top:17px}.dock{position:absolute;left:24px;right:24px;bottom:25px;display:flex;gap:10px;color:#f5ebd6;align-items:center}.dock button{width:140px;height:60px;background:#22453a;color:#f5ebd6;border-color:#426052}.dock .balance{margin-left:20px;flex:1}.dock .start{width:220px;color:#b9c4b8}.overlay{position:absolute;inset:68px 0 0;background:#071712ad;display:flex;justify-content:center;align-items:center;padding-bottom:50px}.modal{width:660px;background:#f5ebd6;border:1px solid #d5c39e;border-radius:8px;padding:26px 30px;box-shadow:0 20px 50px #0008}.compare{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;margin:18px 0;padding:14px 0;border-block:1px solid #d5c39e}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.modelabel{position:absolute;right:28px;top:72px;font-size:14px;color:#b9c4b8}
</style><main id="screen"></main><script>
const mode=new URLSearchParams(location.search).get('state')||'booking';
const header=(step)=>`<header><div><b>LOWER WITTERING FARM</b><div class="small muted">CLASSIC · Festival 4</div></div><div class="steps"><span class="${step===1?'active':'muted'}">1 · Band booking</span><span class="muted">→</span><span class="${step===2?'active':'muted'}">2 · Site preparation</span></div><button>Main menu</button></header>`;
const acts=[['Meadow Lanterns','Folk','40','2.0','1.0','4.0','3.0'],['Barnstorm Circuit','Rock','55','3.0','2.0','3.5','3.5'],['Orchard Chorus','Folk','75','3.5','2.5','4.5','4.0'],['Field Frequency','Electronic','85','4.0','3.0','4.0','3.5'],['Copper Static','Rock','90','4.0','4.0','3.5','4.0'],['Neon Postcards','Pop','110','4.5','4.5','4.5','4.0']];
const booking=`<section class="sheet"><h1>Book your festival</h1><div class="sub">Draft freely. Choose every act and your ticket price, then confirm to resolve sales.</div><div class="cols"><section><h2>Running order</h2><div class="sub">Trailer Stage · 3 of 3 sets filled</div>${[['Set 1','Meadow Lanterns','Folk · £40','folk'],['Set 2','Orchard Chorus','Folk · £75','folk'],['Headline','Neon Postcards','Pop · £110','pop']].map((a,i)=>`<div class="slot ${a[3]}"><div class="meta"><span>${a[0]}</span><span>${['01:00–02:45','03:25–05:10','05:50–07:50'][i]}</span></div><strong>${a[1]}</strong><div class="meta"><span>${a[2]}</span><span>Remove ×</span></div></div>`).join('')}<p class="small">Select an act, then a set. Dragging also works.</p></section><section class="rule"><h2>Available acts</h2><div style="display:flex;justify-content:space-between;align-items:center"><button>All genres ▾</button><span class="sub">Fee ↑ · 6 acts</span></div><table class="table"><thead><tr>${['Act','Genre','Fee','Popular','Ego','Pro','Talent'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${acts.map((a,i)=>`<tr class="${[0,2,5].includes(i)?'chosen':''}"><td class="name">${a[0]}</td><td>${a[1]}</td><td>£${a[2]}</td>${a.slice(3).map(x=>`<td class="rating">${x}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="small">Popularity draws buyers. Talent shapes satisfaction.</p><div class="sub">Ratings / 5 · High ego is more demanding.</div></section><aside class="rule"><h2>Ticket sales</h2><div class="price"><button aria-label="Lower price">−</button><span class="value">£10</span><button aria-label="Raise price">+</button><span class="small">each</span></div><div class="small">Estimated sales</div><div class="metric">100–140 <span style="font:18px Source">tickets</span></div><div class="sub">Maximum capacity: 160</div><div class="note">Popular headline draws buyers.<br>Higher prices can reduce demand.</div><div class="budget"><div class="moneyline"><span>Current balance</span><b>£800</b></div><div class="moneyline"><span>Band cost on confirm</span><b>£225</b></div><div class="moneyline"><span>Low-end ticket income</span><b>£1,000</b></div><div style="margin-top:10px" class="small">Projected site-prep budget</div><h2>£1,575 <span style="font:16px Source">at 100 sales</span></h2><div class="sub">Estimate only; actual sales may vary.</div></div></aside></div></section>`;
const footer=`<div class="foot"><div><button>Back to forecast</button><span style="margin-left:18px">Nothing charged while drafting.</span></div><button class="gold">Confirm bookings &amp; sell tickets →</button></div>`;
const result=`<section class="sheet result"><div class="eyebrow">BOOKINGS CONFIRMED</div><h1 style="margin-top:7px">124 tickets sold</h1><div class="sub">£10 per ticket · Capacity 160 · Your programme is booked.</div><div class="resultgrid"><div><h2>Ready to prepare the site</h2><p>Build, staff and stock for 124 attendees.</p><div class="note">Programme changes are still possible. Changes after sales may disappoint attendees.</div><p class="small" style="margin-top:20px">Review the existing opening checklist before starting the festival.</p></div><div><h2>Your site-prep funds</h2><div class="moneyline"><span>Previous balance</span><b>£800</b></div><div class="moneyline"><span>Ticket sales · 124 × £10</span><b>+ £1,240</b></div><div class="moneyline"><span>Confirmed band spend</span><b>− £225</b></div><div class="total"><div class="small">Available for site preparation</div><div class="metric">£1,815</div><div class="small">Bands paid · no second charge at Start</div></div></div></div><div class="actions"><button class="gold">Continue to site preparation →</button></div></section><div class="dock"><button>Build</button><button>Programme</button><button>Staff</button><button>Supplies</button><div class="balance"><div class="small muted">SITE-PREP BUDGET</div><h2>£1,815 available</h2></div><button class="start">Start festival<br><span class="small">Checklist incomplete</span></button></div>`;
const modal=`<div class="overlay"><section class="modal"><div class="eyebrow">PROGRAMME CHANGE · TICKETS ALREADY SOLD</div><h1 style="margin-top:8px">Replace your headliner?</h1><div class="compare"><div><span class="sub">Booked · Headline</span><h3>Neon Postcards</h3><span class="small">Popularity 4.5 / 5</span></div><span>→</span><div><span class="sub">Replacement · Headline</span><h3>Copper Static</h3><span class="small">Popularity 4.0 / 5</span></div></div><div class="note warn"><b>Attendees may be disappointed.</b><br>Losing a major headliner has more impact than a minor or comparable change.</div><div style="margin-top:15px"><div class="moneyline"><span>Band refund / replacement fee</span><b>+ £60 / − £90</b></div><div class="moneyline"><span>Net cost of this change</span><b>£30</b></div><div class="moneyline"><span>Site-prep funds after change</span><b>£1,785</b></div></div><div class="sub" style="margin-top:10px">124 tickets already sold. This does not run sales again.</div><div class="actions"><button>Keep current booking</button><button class="gold">Replace headliner</button></div></section></div>`;
document.getElementById('screen').innerHTML=header(mode==='booking'?1:2)+(mode==='sales'?result:mode==='rebook'?booking.replace(/<aside class="rule">[\s\S]*?<\/aside>/, '<aside class="rule"><h2>Sales confirmed</h2><div class="metric">124 tickets</div><p>£1,240 ticket income</p><div class="budget"><div class="sub">Site-prep funds</div><h2>£1,815</h2></div><p class="small">Changes affect your attendees and remaining funds.</p><button>Cancel festival…</button><p class="sub">Last resort · refunds and reputation loss</p></aside>').replace('Book your festival','Manage your programme').replace('Draft freely. Choose every act and your ticket price, then confirm to resolve sales.','124 tickets sold. Review changes before confirming.')+`<div class="foot"><button>Back to site preparation</button><span>Programme changes require confirmation.</span></div>`:booking+footer)+(mode==='rebook'?modal:'')+`<div class="modelabel">DESIGN EXAMPLE · Figures${mode==='rebook'?' and refund terms':''} illustrative · Time labels provisional</div>`;
function fit(){document.querySelector('main').style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)})`}fit();addEventListener('resize',fit);
</script></html>
