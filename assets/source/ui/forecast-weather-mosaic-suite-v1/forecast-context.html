<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic forecast · design mockup</title>
<style>
@font-face{font-family:Source;src:url('../forecast-screen-concepts-v1/references/SourceSans3-Variable.ttf')}@font-face{font-family:Zilla;src:url('../forecast-screen-concepts-v1/references/ZillaSlab-SemiBold.ttf')}
*{box-sizing:border-box}body{margin:0;background:#0e1f1a;color:#f5ebd6;font-family:Source,sans-serif;overflow:hidden}.screen{width:1280px;height:720px;position:absolute;transform-origin:0 0;background:linear-gradient(125deg,#17302a,#0e1f1a)}.kicker{position:absolute;left:52px;top:39px;font-size:17px;letter-spacing:1.5px;color:#b9c4b8}h1{position:absolute;left:50px;top:68px;font:44px Zilla;margin:0}.summary{position:absolute;left:52px;top:125px;font-size:24px}.range{position:absolute;left:52px;top:163px;font-size:19px;color:#b9c4b8}.art{position:absolute;right:52px;top:37px;width:216px;height:144px;object-fit:contain;border-radius:5px}.paper{position:absolute;left:48px;top:211px;width:1184px;height:374px;background:#f5ebd6;border:1px solid #d5c39e;border-radius:10px;box-shadow:0 12px 32px #0003}.paper h2{position:absolute;left:30px;top:17px;font:25px Zilla;margin:0;color:#1f2a26}.clocknote{position:absolute;right:30px;top:23px;color:#56615a;font-size:17px}.chart{position:absolute;inset:0;width:1184px;height:374px}.chart text{font-family:Source;fill:#1f2a26}.chart .muted{fill:#56615a}.chart .value{font-family:Zilla}.button{position:absolute;top:625px;height:52px;border-radius:6px;font:600 20px Source;cursor:pointer}.menu{left:48px;width:169px;color:#f5ebd6;background:transparent;border:1px solid #b9c4b8}.continue{right:48px;width:326px;border:1px solid #d8a43b;background:#d8a43b;color:#1f2a26}.button:hover{filter:brightness(1.08)}.button:focus-visible{outline:2px solid #f5ebd6;outline-offset:4px}.planning{position:absolute;left:250px;top:638px;font-size:19px;color:#b9c4b8}.tinyline{position:absolute;left:48px;right:48px;top:606px;height:1px;background:#ffffff20}
</style>
<main class="screen" aria-label="Classic festival forecast design mockup">
<div class="kicker">CLASSIC · LOWER WITTERING FARM</div><h1>Festival 4 forecast</h1><div class="summary" id="summary"></div><div class="range" id="range"></div><img class="art" src="masters/showery-mixed.png" alt="">
<section class="paper" aria-label="Weather timeline"><h2>Your festival day</h2><div class="clocknote">Festival clock · 00:00–08:00</div><svg class="chart" viewBox="0 0 1184 374" role="img" id="chart"></svg></section>
<div class="tinyline"></div><button class="button menu">‹ &nbsp; Main menu</button><div class="planning" id="planning"></div><button class="button continue" autofocus>Continue to preparation &nbsp; →</button>
</main>
<script>
const extreme=new URLSearchParams(location.search).has('rain');
const data=extreme?{summary:'Heavy showers, with a downpour late on.',range:'13–17°C · Wet spells with dry breaks',temps:[16,17,16,14,13],rain:[[0,60,'Dry'],[60,165,'Heavy showers'],[165,350,'Dry'],[350,390,'Downpour'],[390,480,'Dry']],detail:'Heavy showers 01:00–02:45 · Downpour 05:50–06:30',planning:'Shelter, ponchos and matting for wet spells.'}:{summary:'Mild, with a short shower.',range:'17–21°C · Mostly dry',temps:[18,20,21,19,17],rain:[[0,205,'Dry'],[205,250,'Showers'],[250,480,'Dry']],detail:'Showers 03:25–04:10',planning:'Shelter and ponchos for the shower.'};
for(const k of ['summary','range','planning'])document.getElementById(k).textContent=data[k];
const x=t=>222+t/480*914, y=t=>222-(t-13)*6;
let svg=`<defs><pattern id="rain" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c9e0df"/><path d="M-2 8L8-2M6 10L10 6" stroke="#87b6b3" stroke-width="1"/></pattern><pattern id="downpour" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#215f62"/><path d="M-2 6L6-2M4 8L8 4" stroke="#80b7bc" stroke-width="1"/></pattern></defs>`;
svg+=`<text x="30" y="91" font-size="18" font-weight="600">Programme</text>`;
const stages=[[0,60,'Arrivals'],[60,165,'Set 1'],[205,310,'Set 2'],[350,470,'Set 3']];
svg+=`<rect x="222" y="68" width="914" height="32" rx="4" fill="#e2d3b3"/>`;
for(const [a,b,label] of stages)svg+=`<rect x="${x(a)}" y="68" width="${x(b)-x(a)}" height="32" rx="4" fill="${a===0?'#e2d3b3':'#dceae5'}" stroke="#bfd7cf"/><text x="${(x(a)+x(b))/2}" y="90" text-anchor="middle" font-size="18" font-weight="600">${label}</text>`;
for(const [a,b,label] of stages.filter(s=>s[0])){const f=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');svg+=`<text x="${(x(a)+x(b))/2}" y="121" text-anchor="middle" font-size="16" class="muted">${f(a)}–${f(b)}</text>`;}
for(let i=0;i<5;i++){let px=x(i*120);svg+=`<path d="M${px} 143V299" stroke="#d5c39e" stroke-dasharray="3 5"/><text x="${px}" y="322" text-anchor="middle" font-size="17">0${i*2}:00</text>`;}
svg+=`<text x="1136" y="348" text-anchor="end" font-size="16" class="muted">Closing</text><text x="222" y="348" font-size="17" class="muted">${data.detail}</text>`;
svg+=`<text x="30" y="185" font-size="18" font-weight="600">Temperature</text><text x="30" y="210" font-size="17" class="muted">°C</text>`;
svg+=`<path d="${data.temps.map((t,i)=>(i?'L':'M')+x(i*120)+','+y(t)).join(' ')}" fill="none" stroke="#946716" stroke-width="3"/>`;
data.temps.forEach((t,i)=>{let px=x(i*120),py=y(t);svg+=`<circle cx="${px}" cy="${py}" r="5" fill="#f5ebd6" stroke="#946716" stroke-width="3"/><text x="${px}" y="${py-17}" text-anchor="middle" font-size="23" class="value">${t}°</text>`;});
svg+=`<text x="30" y="277" font-size="18" font-weight="600">Rainfall</text><text x="30" y="301" font-size="17" class="muted">Intensity</text>`;
for(const [a,b,label] of data.rain){let fill=label==='Dry'?'#fff8e9':label==='Downpour'?'url(#downpour)':'url(#rain)';svg+=`<rect x="${x(a)}" y="253" width="${x(b)-x(a)}" height="40" rx="3" fill="${fill}" stroke="#a9b9ac"/><text x="${(x(a)+x(b))/2}" y="279" text-anchor="middle" font-size="17" style="fill:${label==='Downpour'?'#fff8e9':'#1f2a26'}">${label}</text>`;}
document.getElementById('chart').innerHTML=svg;document.getElementById('chart').setAttribute('aria-label',data.summary+' Temperature at 00:00, 02:00, 04:00, 06:00 and 08:00: '+data.temps.join(', ')+' degrees Celsius. '+data.detail+'.');
function fit(){document.querySelector('.screen').style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}fit();addEventListener('resize',fit);
</script></html>
